    <style>
        * {
            box-sizing: border-box;

<body>

<div class="game">

    <div class="header">
        <h1>Nora</h1>
        <p>Someone just knocked on her door...</p>
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-name">
                <span>❤️ Affection</span>
                <span id="loveValue">10%</span>
            </div>
            <div class="bar">
                <div id="loveBar" class="fill love" style="width: 10%;"></div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-name">
                <span>🤝 Friendship</span>
                <span id="friendshipValue">10%</span>
            </div>
            <div class="bar">
                <div id="friendshipBar" class="fill friendship" style="width: 10%;"></div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-name">
                <span>🔐 Trust</span>
                <span id="trustValue">10%</span>
            </div>
            <div class="bar">
                <div id="trustBar" class="fill trust" style="width: 10%;"></div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-name">
                <span>😊 Mood</span>
                <span id="moodValue">50%</span>
            </div>
            <div class="bar">
                <div id="moodBar" class="fill mood" style="width: 50%;"></div>
            </div>
        </div>

    </div>

    <div class="chat" id="chat">

        <div class="message nora">
            <div class="name">Nora</div>
            Hey... I wasn't expecting anyone to come by.
        </div>

    </div>

    <div class="input-area">
        <input
            id="messageInput"
            type="text"
            placeholder="Say something to Nora..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">Send</button>
    </div>

    <button class="reset" onclick="resetChat()">Reset</button>

</div>

<script>

async function sendMessage() {

    const input = document.getElementById("messageInput");
    const message = input.value.trim();

    if (!message) return;

    addMessage("You", message, "player");

    input.value = "";

    try {

        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        addMessage("Nora", data.response, "nora");

    } catch (error) {

        addMessage(
            "Nora",
            "Sorry... something went wrong.",
            "nora"
        );

        console.error(error);
    }
}


function addMessage(name, text, type) {

    const chat = document.getElementById("chat");

    const message = document.createElement("div");
    message.className = "message " + type;

    message.innerHTML = `
        <div class="name">${name}</div>
        ${text}
    `;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
}


function resetChat() {

    document.getElementById("chat").innerHTML = `
        <div class="message nora">
            <div class="name">Nora</div>
            Hey... I wasn't expecting anyone to come by.
        </div>
    `;

    document.getElementById("loveBar").style.width = "10%";
    document.getElementById("friendshipBar").style.width = "10%";
    document.getElementById("trustBar").style.width = "10%";
    document.getElementById("moodBar").style.width = "50%";

    document.getElementById("loveValue").textContent = "10%";
    document.getElementById("friendshipValue").textContent = "10%";
    document.getElementById("trustValue").textContent = "10%";
    document.getElementById("moodValue").textContent = "50%";
}


document.getElementById("messageInput").addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

</script>

</body>
</html>
